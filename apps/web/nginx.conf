# 這個檔是 nginx 的模板，不是直接的設定檔：
# nginx 官方映像啟動時會把 /etc/nginx/templates/*.template 內的 ${變數} 換成環境變數，
# 再寫到 /etc/nginx/conf.d/。上游因此可以用 API_UPSTREAM 指定（Dockerfile 給預設 api:4420），
# 驗收看另一組 api 時不用改檔。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 檔案上傳走 /api/files，nginx 預設只收 1 MiB，會在 API 之前就擋掉。
  # 與 API 的 MAX_UPLOAD_BYTES 預設值一致（200 MiB）。
  client_max_body_size 200m;

  # 回應標頭（S1-02／#78）。全部用 `always`：404 與 5xx 的回應一樣要有，
  # 否則錯誤頁會成為唯一沒有這些保護的回應。
  # 本張刻意不加 Content-Security-Policy —— 它牽涉 Vite 的輸出（inline script 等），
  # 要另外評估，不可以在同一個改動裡順手加上去。
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://${API_UPSTREAM}/;
    proxy_http_version 1.1;

    # 一定要帶埠。API 的 CSRF 檢查會比對 Origin 的 host（含埠）與請求的 Host；
    # $host 不含埠，瀏覽器由 127.0.0.1:4210 送出的 POST 會被判成 403 bad_origin。
    proxy_set_header Host $http_host;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 這個請求由哪個入口進來（決策 C26／C27）。用 proxy_set_header 是**覆寫**：
    # 客戶端自己帶的 X-Company-OS-Entry 會被蓋掉，後端可以信任這個值。
    # 只有內網入口，所以寫死 internal；partner／customer 兩個入口屬 S8-01。
    proxy_set_header X-Company-OS-Entry internal;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
