<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company OS</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="titlebar">
  <div class="titlebar-left">
    <span class="brand">Company OS</span>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" role="tab" data-view="approvals" aria-selected="true">待批准<span class="badge" id="badge-approvals" hidden></span></button>
      <button class="tab" role="tab" data-view="needs" aria-selected="false">Needs<span class="badge" id="badge-needs" hidden></span></button>
      <button class="tab" role="tab" data-view="actions" aria-selected="false">分級表</button>
      <button class="tab" role="tab" data-view="audit" aria-selected="false">審計</button>
    </nav>
  </div>
  <div class="titlebar-right">
    <span class="chip" id="chain-chip" title="審計日誌雜湊鏈狀態">審計 —</span>
    <button class="btn btn-ghost" id="btn-breaker">熔斷</button>
  </div>
</header>

<main>
  <section class="view is-active" id="view-approvals">
    <div class="section-head">
      <h1>批准收件匣</h1>
      <p class="lede">每一項都要你看過才執行。逾時未批准會自動取消。</p>
    </div>
    <div id="approvals-list" class="list"></div>
  </section>

  <section class="view" id="view-needs">
    <div class="section-head">
      <h1>Needs 工單</h1>
      <p class="lede">Agent 做不到的工作會開單交給你或同事。</p>
    </div>
    <div id="needs-list" class="list"></div>
  </section>

  <section class="view" id="view-actions">
    <div class="section-head">
      <h1>動作分級表</h1>
      <p class="lede">風險按動作分級。未在此表登記的動作一律擋下。</p>
    </div>
    <table class="table" id="actions-table">
      <thead><tr><th>動作</th><th>級別</th><th>金額上限</th><th>說明</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="view" id="view-audit">
    <div class="section-head">
      <h1>審計日誌</h1>
      <p class="lede">只可追加、雜湊鏈。任何改動都會令鏈驗證失敗。</p>
    </div>
    <div class="audit-head">
      <span class="chip" id="audit-chip">—</span>
      <button class="btn btn-line" id="btn-verify">重新驗證</button>
    </div>
    <div id="audit-list" class="list list-compact"></div>
  </section>
</main>

<footer class="statusbar">
  <span id="status-left">載入中</span>
  <span id="status-right"></span>
</footer>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
