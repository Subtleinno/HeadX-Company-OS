name: company-os

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?請先複製 .env.example 為 .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請先複製 .env.example 為 .env}
      POSTGRES_DB: ${POSTGRES_DB:?請先複製 .env.example 為 .env}
    ports:
      - "127.0.0.1:${DB_PORT:-25432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  storage:
    build: ./docker/minio
    image: company-os-minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?請先複製 .env.example 為 .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?請先複製 .env.example 為 .env}
    ports:
      # 社群版不會再有安全更新，所以只綁本機，不對外開放。
      - "127.0.0.1:${PORT_MINIO_API:-29000}:9000"
      - "127.0.0.1:${PORT_MINIO_CONSOLE:-29001}:9001"
    volumes:
      # bind mount，不用 named volume：檔案是唯一無法重新生成的資料，
      # docker compose down -v 不可以刪得到它。Windows 路徑用正斜線。
      - ${MINIO_DATA_DIR:-./.data/minio}:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4420"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?請先複製 .env.example 為 .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?請先複製 .env.example 為 .env}
      PGDATABASE: ${POSTGRES_DB:?請先複製 .env.example 為 .env}
      # API 經 compose 網路連 storage，不經主機端口。
      MINIO_ENDPOINT: http://storage:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?請先複製 .env.example 為 .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?請先複製 .env.example 為 .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-company-os}
      # 單一檔案上傳上限；與 apps/web/nginx.conf 的 client_max_body_size 一致。
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      # 經 HTTPS 入口才設 true；本機 http 預設關，否則瀏覽器不會存 session cookie。
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 登入失敗審計用的 HMAC key；沒有預設值，未設定時 compose 即時失敗，
      # API 自己也再擋一次（不會用空字串當 key）。
      LOGIN_FAILURE_HASH_KEY: ${LOGIN_FAILURE_HASH_KEY:?請在 .env 設定登入失敗審計用的 HMAC key}
    ports:
      - "127.0.0.1:${API_PORT:-4420}:4420"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  # 內網入口（S1-02／#78）。原本叫 web；改名之後仍然是同一個 nginx 映像，
  # 只是名字與端口變數改為 gateway-internal／GATEWAY_INTERNAL_PORT。
  # 端口寫成 ${GATEWAY_INTERNAL_PORT:-${WEB_PORT:-4210}}：已有的 .env 只有
  # WEB_PORT 時仍然在 4210 起來，不會因為改名而啟動失敗。
  gateway-internal:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_INTERNAL_PORT:-${WEB_PORT:-4210}}:80"
    depends_on:
      api:
        condition: service_healthy

  # app-host（R8／issue #77）：同一個映像按 APP_SET 載入 app（決策 C32）。
  # 放在 profile apps 之下：預設 docker compose up 不會啟動它，
  # 要 docker compose --profile apps up -d apps 才會。
  apps:
    build:
      context: .
      dockerfile: apps/app-host/Dockerfile
    restart: unless-stopped
    profiles: ["apps"]
    environment:
      # 要載入哪些 app；留空即不載入任何 app，容器仍然健康。目前沒有任何真實 app。
      APP_SET: ${APP_SET:-}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?請先複製 .env.example 為 .env}
      # 每個 app 的資料庫帳號由 APP_DB_<ID>_USER／APP_DB_<ID>_PASSWORD 提供。
      # 刻意不給 PGUSER／PGPASSWORD：app 一定要用自己的帳號，不留回退路。
    ports:
      - "127.0.0.1:${APPS_PORT:-4431}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
