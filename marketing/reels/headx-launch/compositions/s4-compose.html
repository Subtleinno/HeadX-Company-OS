  <script>
    const tl = gsap.timeline({ paused: true });
    const pages = ["#s4-p1", "#s4-p2", "#s4-p3", "#s4-p4", "#s4-p5"];
    const thumbs = ["#s4-t1", "#s4-t2", "#s4-t3", "#s4-t4", "#s4-t5"];
    const counter = document.getElementById("s4-counter");
    const labels = ["01 / 05", "02 / 05", "03 / 05", "04 / 05", "05 / 05"];

    function show(i, at) {
      tl.call(() => {
        counter.textContent = labels[i];
      }, null, at);
      /* 硬切，不做交叉淡入：兩頁都是實色，blend 會出現雙重影像 */
      tl.set(pages, { opacity: 0 }, at);
      tl.fromTo(pages[i], { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, at);
      tl.call(
        () => {
          thumbs.forEach((t, k) => document.querySelector(t).classList.toggle("on", k === i));
        },
        null,
        at
      );
    }

    tl.fromTo("#s4-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.05);
    tl.fromTo("#s4-title", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.12);
    tl.fromTo(
      "#s4-stage",
      { opacity: 0, y: 26, scale: 0.975 },
      { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" },
      0.3
    );
    tl.fromTo("#s4-thumbs", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.55);

    show(0, 0.8);
    show(1, 1.95);
    show(2, 3.05);
    show(3, 4.1);
    show(4, 5.35);

    /* 五頁砌完，但缺口仍然在：拉回第 4 頁 */
    tl.call(
      () => {
        counter.textContent = "04 / 05";
        thumbs.forEach((t, k) => document.querySelector(t).classList.toggle("on", k === 3));
      },
      null,
      6.75
    );
    tl.to("#s4-p5", { opacity: 0, duration: 0.26 }, 6.72);
    tl.fromTo("#s4-p4", { opacity: 0 }, { opacity: 1, duration: 0.26 }, 6.72);
    tl.fromTo("#s4-flag", { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.95);

    window.__timelines["s4"] = tl;
  </script>
