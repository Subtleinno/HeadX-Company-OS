<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>HeadX Marketing Design — 60s Reel</title>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      /* ---- HeadX design tokens，取自 packages/design-tokens/src/tokens.css ---- */
      @font-face {
        font-family: "HX TC";
        src: local("PingFangTC-Regular");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "HX TC";
        src: local("PingFangTC-Medium");
        font-weight: 500;
        font-display: block;
      }
      @font-face {
        font-family: "HX TC";
        src: local("PingFangTC-Semibold");
        font-weight: 600;
        font-display: block;
      }
      @font-face {
        font-family: "HX TC";
        src: local("PingFangTC-Semibold");
        font-weight: 700;
        font-display: block;
      }

      :root {
        --paper: #ffffff;
        --ink: #1d1d1f;
        --ink-2: #68686c;
        --ink-3: #a1a1a6;
        --line: #e8e8ed;
        --line-2: #d2d2d7;
        --surface: #f5f5f7;
        --black: #000000;
        --warn: #ff9500;
        --ok: #34c759;
        --font: "HX TC", -apple-system, sans-serif;
        --mono: "SF Mono", ui-monospace, Menlo, monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--paper);
        font-family: var(--font);
        color: var(--ink);
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: var(--paper);
      }

      /* 安全帶：平台 UI 佔 0–168 與 1330 以下 */
      .safe {
        position: absolute;
        left: 64px;
        width: 952px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1-hook.html" data-start="0" data-duration="3.8" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2-prompt.html" data-start="3.8" data-duration="6.7" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3-libraries.html" data-start="10.5" data-duration="7.5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4-compose.html" data-start="18" data-duration="8.4" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5-need-photo.html" data-start="26.4" data-duration="8.6" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6-need-claim.html" data-start="35" data-duration="9.2" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7-output.html" data-start="44.2" data-duration="8.4" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="s8" data-composition-id="s8" data-composition-src="compositions/s8-outro.html" data-start="52.6" data-duration="7.4" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="caps" data-composition-id="caps" data-composition-src="compositions/captions.html" data-start="0" data-duration="60" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- 音效：時間對齊各場剪點 -->
      <audio id="sfx-type" src="assets/audio/sfx/typing.mp3" data-start="4.55" data-duration="1.5" data-volume="0.42" data-track-index="4"></audio>
      <audio id="sfx-start" src="assets/audio/sfx/click-soft.mp3" data-start="7.3" data-duration="0.45" data-volume="0.8" data-track-index="5"></audio>
      <audio id="sfx-w1" src="assets/audio/sfx/whoosh-short.mp3" data-start="10.45" data-duration="0.8" data-volume="0.45" data-track-index="5"></audio>
      <audio id="sfx-w2" src="assets/audio/sfx/whoosh-short.mp3" data-start="17.95" data-duration="0.8" data-volume="0.45" data-track-index="5"></audio>
      <audio id="sfx-n1" src="assets/audio/sfx/notification.mp3" data-start="26.45" data-duration="1.0" data-volume="0.5" data-track-index="5"></audio>
      <audio id="sfx-n2" src="assets/audio/sfx/notification.mp3" data-start="35.05" data-duration="1.0" data-volume="0.5" data-track-index="5"></audio>
      <audio id="sfx-tap" src="assets/audio/sfx/click-soft.mp3" data-start="39.65" data-duration="0.45" data-volume="0.85" data-track-index="5"></audio>
      <audio id="sfx-pop" src="assets/audio/sfx/pop.mp3" data-start="45.1" data-duration="0.6" data-volume="0.5" data-track-index="5"></audio>
      <audio id="sfx-out" src="assets/audio/sfx/sparkle.mp3" data-start="47.95" data-duration="1.3" data-volume="0.35" data-track-index="5"></audio>
      <audio id="sfx-hit" src="assets/audio/sfx/impact-bass-1.mp3" data-start="52.6" data-duration="1.8" data-volume="0.45" data-track-index="5"></audio>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
