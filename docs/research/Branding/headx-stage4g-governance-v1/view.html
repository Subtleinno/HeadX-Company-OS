<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stage 04G · 跨媒體使用與治理 (View)</title><link rel="stylesheet" href="shared.css"/>
<style>
.spec{max-width:1120px;margin:0 auto;padding:60px 28px 120px}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.title{font-family:var(--serif);font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;margin:12px 0 18px}
.empty{color:var(--muted)}.prog{display:inline-block;margin:10px 0 0;font-family:var(--mono);font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:#fff}
.sec{border-top:1px solid var(--line);margin-top:46px;padding-top:22px}.sec h3{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 6px}.lead{font-size:.86rem;color:var(--muted);margin:0 0 14px;max-width:76ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}.c b{display:block;font-size:.95rem}.c p{margin:4px 0 0;font-size:.8rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.82rem;background:#fff;border:1px solid var(--line)}th,td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}th{font-family:var(--mono);font-size:.68rem;color:var(--muted);font-weight:500}.ok{color:var(--ok)}.no{color:var(--danger)}.wn{color:var(--warn)}.tw{overflow-x:auto}
.mc{text-align:center;font-size:.74rem;border-radius:4px}.mc.A{background:#E6F4EA;color:#14532D}.mc.C{background:#FEF3C7;color:#78350F}.mc.X{background:#FEE2E2;color:#7F1D1D}
.sb{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.sb>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:90px}.sb small{font-family:var(--mono);font-size:.68rem;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:6px}
.hi{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.hi>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}.hi h4{margin:0 0 8px;font-family:var(--mono);font-size:.74rem;color:var(--accent)}.hi li{font-size:.82rem;margin-bottom:6px}.hi small{display:block;color:var(--muted)}.hi ul{margin:0;padding-left:16px}
.ck li{margin-bottom:6px;font-size:.86rem}.ck .warn{color:var(--warn)}.ck .error{color:var(--danger)}.ck .info{color:var(--muted)}
.avoid{display:flex;flex-wrap:wrap;gap:8px}.avoid span{background:var(--danger-bg);border:1px solid #FECACA;color:#991B1B;border-radius:999px;padding:3px 12px;font-size:.84rem}
.draft{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:8px 14px;font-size:.8rem;margin-top:14px}
@media(max-width:700px){table{display:block;overflow-x:auto}}
</style></head><body>
<nav class="topbar"><div class="brand-tag">COMPANY OS · BRAND STAGE 04G · 跨媒體使用與治理</div>
<div class="nav-links"><a class="nav-pill" href="edit.html">Edit</a><a class="nav-pill active" href="view.html">View</a><a class="nav-pill" href="agent.html">AI Agent</a></div></nav>
<main class="spec" id="m"></main>
<script src="options.js"></script><script src="core.js"></script>
<script>
const s=load(),cmp=completeness(s),E=esc;
const L=k=>labels(k,s),X=id=>T_(s,id);
const cardsOf=k=>{const it=items(k,s);return it.length?`<div class="cards">${it.map(i=>`<div class="c"><b>${E(i.zh)}</b>${i.desc?`<p>${E(i.desc)}</p>`:""}${i.avoid&&i.avoid!=="-"?`<p>注意：${E(i.avoid)}</p>`:""}</div>`).join("")}</div>`:'<p class="empty">尚未選擇</p>'};
const dimRow=d=>{const dm=DIM(d),o=picked(s,d);return `<tr><th>${dm.title}</th><td>${o?`<b>${E(o.zh)}</b><br><small>${E(o.desc)}</small>`:'<span class="empty">尚未選擇</span>'}</td></tr>`};
const sub=(t,k)=>`<p class="lead" style="margin:12px 0 6px"><b>${t}</b></p>${cardsOf(k)}`;
const names=cwNames(s);
const mat=`<div class="tw"><table><tr><th>配色變體</th>${CTX.map(c=>`<th>${c.zh}${s.ctxOff[c.id]?"（不適用）":""}</th>`).join("")}</tr>${names.map(n=>`<tr><td><b>${E(n)}</b>${s.cwnote[n]?`<br><small>${E(s.cwnote[n])}</small>`:""}</td>${CTX.map(c=>{const v=cwCell(s,n,c.id);return `<td class="mc ${v}" style="${s.ctxOff[c.id]?"opacity:.35":""}">${CWSTATE[v]}</td>`}).join("")}</tr>`).join("")}</table></div>`;
const reg=s.reg.length?`<div class="tw"><table><tr><th>色彩／資產</th><th>規格</th><th>色票／ICC</th><th>印刷廠</th><th>工單</th><th>日期</th><th>核准者</th><th>有效至</th><th>狀態</th></tr>${s.reg.map(r=>{const pi=proofInfo(s,r);return `<tr><td>${E(r.item||"—")}</td><td>${E(r.spec||"—")}</td><td>${E(r.book||"—")}</td><td>${E(r.printer||"—")}</td><td>${E(r.jobv||"—")}</td><td>${E(r.date||"—")}</td><td>${E(r.approver||"—")}</td><td>${fmtD(pi.exp)||"—"}</td><td class="${pi.state==="已核准"?"ok":/過期|未通過/.test(pi.state)?"no":"wn"}">${pi.state}</td></tr>`}).join("")}</table></div>`:'<p class="empty">尚無打樣登記</p>';
const lic=s.lic.length?`<div class="tw"><table><tr><th>資產</th><th>類型</th><th>授權人</th><th>授權類型</th><th>範圍</th><th>到期</th><th>文件</th><th>負責人</th><th>狀態</th></tr>${s.lic.map(r=>{const li=licInfo(s,r);return `<tr><td>${E(r.asset||"—")}</td><td>${E(r.type||"—")}</td><td>${E(r.licensor||"—")}</td><td>${E(r.ltype||"—")}</td><td>${E(r.scope||"—")}</td><td>${E(r.expiry||"—")}</td><td>${E(r.doc||"—")}</td><td>${E(r.owner||"—")}</td><td class="${li.state==="有效"?"ok":li.state==="已過期"?"no":"wn"}">${li.state}${li.left!=null?(li.left<0?"（已逾 "+(-li.left)+" 天）":"（還有 "+li.left+" 天）"):""}</td></tr>`}).join("")}</table></div>`:'<p class="empty">尚無授權登記</p>';
const tpm=items("touchpoints",s),tpmH=tpm.length?`<div class="tw"><table><tr><th>觸點</th><th>格式</th><th>尺寸</th><th>配色變體</th><th>負責人</th><th>核准</th><th>限制</th></tr>${tpm.map(i=>{const r=tpmRow(s,i.id);return `<tr><td>${E(i.zh)}</td><td>${E(r.fmt||"—")}</td><td>${E(r.size||(i.n1?i.n1+"×"+i.n2:"—"))}</td><td>${E(r.cw||"—")}</td><td>${E(r.owner||"—")}</td><td>${E(r.appr||"—")}</td><td>${E(r.note||"—")}</td></tr>`}).join("")}</table></div>`:'<p class="empty">尚未選擇觸點</p>';
const rac=`<div class="tw"><table><tr><th>活動</th>${ROLES.map(r=>`<th>${r}</th>`).join("")}</tr>${ACTS.map(a=>`<tr><td>${a}</td>${ROLES.map(r=>`<td style="text-align:center"><b>${racCell(s,a,r)||"—"}</b></td>`).join("")}</tr>`).join("")}</table></div>`;
const exc=s.exc.length?`<div class="tw"><table><tr>${EXCCOLS.map(c=>`<th>${c[1]}</th>`).join("")}</tr>${s.exc.map(r=>`<tr>${EXCCOLS.map(c=>`<td>${E(r[c[0]]||"—")}</td>`).join("")}</tr>`).join("")}</table></div>`:'<p class="empty">沒有例外</p>';
const ns=nameScan(s);
const ck=checks(s),hs=hints(s),stages=[...new Set(hs.map(h=>h.stage))].sort();
const hi=stages.map(st=>`<div><h4>${E(st)}</h4><ul>${hs.filter(h=>h.stage===st).map(h=>`<li><b>${E(h.field)}</b>：${E(h.text)}<small>原因：${E(h.why)}</small></li>`).join("")}</ul></div>`).join("");
document.getElementById("m").innerHTML=`
<span class="eyebrow">04G / Cross-media Use &amp; Governance · 草稿 · 未核准</span>
<h1 class="title">${E(brandName(s))}</h1><p style="font-family:var(--serif);font-size:1.1rem;max-width:64ch">${E(X("statement")||draft(s))}</p>
<span class="prog">完成度 ${cmp.pct}%（${cmp.done}/${cmp.total}）${cmp.missing.length?" · 未完成："+cmp.missing.map(m=>m.label.replace(/（.*/,"")).join("、"):""}</span>
<div class="draft">狀態：草稿。登記冊是內部管理工具，不是法律文件；打樣核准、授權與例外必須由人類執行；授權範圍以合約為準；印刷以印刷廠要求為準。</div>
<div class="sec"><h3>範圍與負責人</h3><table style="margin-bottom:12px"><tr><th>資產負責人</th><td>${E(X("owner")||"—")}</td></tr>${dimRow("approvalMode")}</table>${cardsOf("media")}${sub("分發方式","distribution")}</div>
<div class="sec"><h3>色彩打樣登記冊</h3><table style="margin-bottom:12px">${dimRow("proofValidity")}</table>${reg}</div>
<div class="sec"><h3>配色變體 × 場景矩陣</h3>${mat}</div>
<div class="sec"><h3>觸點矩陣</h3>${tpmH}</div>
<div class="sec"><h3>檔案格式、命名與版本</h3>${cardsOf("fileFormats")}<table style="margin-top:12px">${["namePattern","versionScheme"].map(dimRow).join("")}<tr><th>範例檔名</th><td style="font-family:var(--mono)">${E(genName(s)||"—")}</td></tr></table>${ns.length?`<div class="tw" style="margin-top:12px"><table><tr><th>現有檔名</th><th>問題</th></tr>${ns.map(x=>`<tr><td style="font-family:var(--mono)">${E(x.name)}</td><td class="${x.issues.length?"no":"ok"}">${x.issues.length?E(x.issues.join("、")):"通過"}</td></tr>`).join("")}</table></div>`:""}</div>
<div class="sec"><h3>標誌規則與禁用</h3><table style="margin-bottom:12px"><tr><th>最小尺寸</th><td>${E(X("lm_px")||"—")} px（螢幕）／${E(X("lm_mm")||"—")} mm（印刷）</td></tr>${dimRow("logoClear")}<tr><th>x 的定義</th><td>${E(X("lc_note")||"—")}</td></tr></table>${cardsOf("prohibited")}<div class="sb" style="margin-top:12px">${MISUSE.map(([id,l])=>`<div><small>${l}</small>${X(id)?E(X(id)):'<span class="empty">尚未填寫</span>'}</div>`).join("")}</div></div>
<div class="sec"><h3>授權登記冊</h3>${cardsOf("licenseTypes")}<table style="margin:12px 0">${dimRow("licenseWarn")}</table>${lic}</div>
<div class="sec"><h3>跨媒體無障礙</h3>${cardsOf("a11yUse")}</div>
<div class="sec"><h3>責任矩陣（RACI）與例外</h3>${rac}<table style="margin:12px 0">${dimRow("exceptionMax")}</table>${exc}</div>
<div class="sec"><h3>稽核</h3>${cardsOf("audit")}<table style="margin-top:12px">${dimRow("reviewCadence")}</table></div>
<div class="sec"><h3>禁區（治理＋禁用＋Stage 1／4A／4B）</h3><div class="avoid">${negatives(s).map(x=>`<span>${E(x)}</span>`).join("")||'<span style="background:none;border:0;color:var(--muted)">尚未選擇</span>'}</div><p class="lead" style="margin-top:10px">備註：${E(X("st_note")||"—")}</p></div>
<div class="sec"><h3>一致性與硬限制檢查</h3><ul class="ck" style="padding-left:18px">${ck.length?ck.map(x=>`<li class="${x.level}">${x.level==="error"?"✕":x.level==="warn"?"⚠":"ℹ"} ${E(x.msg)}</li>`).join(""):"<li class='info'>目前沒有發現問題。</li>"}</ul></div>
<div class="sec"><h3>給 4H 的建議</h3><p class="lead">依你的選擇推導。請匯出 stage4g-brief.json 帶到 4H。</p><div class="hi">${hi}</div></div>`;
</script></body></html>
